[platformio]
src_dir = .

[env:teensy41]
extra_scripts =
  scripts/pio_bms_monitor.py
  scripts/pio_bms_gui.py
custom_bms_gui_port = auto
custom_bms_gui_baud = 9600

custom_bms_monitor_refresh = 1.0
custom_bms_monitor_dashboard = clear
custom_bms_monitor_log_dir = BMS_Serial_Laptop_Recieved
custom_bms_monitor_port = auto

platform = platformio/teensy
board = teensy41
framework = arduino
monitor_speed = 9600

lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

build_src_filter =
    +<*.ino>
    +<*.h>
    +<*.cpp>
    +<*.c>
    -<.git/>
    -<.pio/>
    -<build/>