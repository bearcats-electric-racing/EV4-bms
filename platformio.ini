[platformio]
src_dir = .

[env:teensy41]
platform = platformio/teensy
board = teensy41
framework = arduino
monitor_speed = 9600

lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

build_src_filter =
    +<*.ino>
    +<*.h>
    +<*.cpp>
    +<*.c>
    -<.git/>
    -<.pio/>
    -<build/>